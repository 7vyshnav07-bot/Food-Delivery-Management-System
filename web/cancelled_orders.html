        <section class="content-card">

                        appears first.
                    </p>

                </div>
                <button onclick="retrieveCancelledOrder()" class="green-button">
    🔄 Retrieve Cancelled Order
</button>

                 class="cancelled-list">
            </div>

<script>



async function loadCancelledOrders() {

    const response =
        await fetch("/api/cancelled");

    const orders =
        await response.json();

    const container =
        document.getElementById("orders");

    container.innerHTML = "";

    orders.forEach((order, index) => {

        container.innerHTML += `

            <div class="cancelled-card">

                <div class="stack-number">
                    ${index + 1}
                </div>

                <div class="cancelled-info">

                    <h3>
                        ${order.orderId}
                    </h3>

                    <p>
                        Customer:
                        ${order.customerName}
                    </p>

                    <p>
                        Food:
                        ${order.foodItem}
                    </p>

                    <p>
                        Total:
                        ₹${Number(order.total).toFixed(2)}
                    </p>

                </div>

                <span class="status cancelled">
                    Cancelled
                </span>

            </div>

        `;
    });

    if (orders.length === 0) {

        container.innerHTML = `
            <div class="empty-state">
                No cancelled orders yet.
            </div>
        `;
    }
}


/* =====================================================
   RETRIEVE FROM STACK
===================================================== */

async function retrieveCancelledOrder() {

    const response =
        await fetch("/api/cancelled/retrieve", {
            method: "POST"
        });

    const result =
        await response.json();

    if (!response.ok || !result.success) {

        showToast(result.message, "error");

        return;
    }

    showToast(
        "Order " +
        result.orderId +
        " retrieved successfully!",
        "success"
    );

    /*
       Send the user back to Orders
       after showing the toast.
    */

    setTimeout(() => {

        window.location.href =
            "/orders.html";

    }, 1500);
}


/* =====================================================
   TOAST
===================================================== */

function showToast(message, type) {

    const toast =
        document.createElement("div");

    toast.className =
        "toast " + type;

    toast.textContent =
        message;

    document.body.appendChild(toast);

    setTimeout(() => {
        toast.classList.add("show");
    }, 10);

    setTimeout(() => {

        toast.classList.remove("show");

        setTimeout(() => {
            toast.remove();
        }, 300);

    }, 2500);
}


/*
   Load cancelled orders when page opens.
*/

loadCancelledOrders();

</script>
