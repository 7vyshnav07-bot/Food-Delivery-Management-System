<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodFlow - Admin Login</title>


    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(50, 199, 106, 0.12),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(50, 199, 106, 0.10),
                    transparent 30%
                ),

                #0b0f0d;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            position: relative;

        }


        /* =========================================
           ANIMATED BACKGROUND
        ========================================= */

        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

        }


        .blob {

            position: absolute;

            border-radius: 50%;

            filter: blur(5px);

            opacity: 0.18;

            animation:
                floatBlob 10s ease-in-out infinite;

        }


        .blob-one {

            width: 420px;
            height: 420px;

            background: #32c76a;

            top: -180px;
            left: -120px;

        }


        .blob-two {

            width: 330px;
            height: 330px;

            background: #19a957;

            bottom: -140px;
            right: -100px;

            animation-delay: -3s;

        }


        .blob-three {

            width: 220px;
            height: 220px;

            background: #52e985;

            top: 45%;
            right: 15%;

            opacity: 0.08;

            animation-delay: -6s;

        }


        @keyframes floatBlob {

            0%,
            100% {

                transform:
                    translate(0, 0)
                    scale(1);

            }

            50% {

                transform:
                    translate(30px, -30px)
                    scale(1.08);

            }

        }


        /* =========================================
           FLOATING FOOD ICONS
        ========================================= */

        .food-icon {

            position: absolute;

            font-size: 32px;

            opacity: 0.12;

            animation:
                floatFood 8s ease-in-out infinite;

        }


        .food-1 {

            top: 12%;
            left: 12%;

        }


        .food-2 {

            top: 25%;
            right: 12%;

            animation-delay: -2s;

        }


        .food-3 {

            bottom: 18%;
            left: 16%;

            animation-delay: -4s;

        }


        .food-4 {

            bottom: 12%;
            right: 18%;

            animation-delay: -6s;

        }


        @keyframes floatFood {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(0deg);

            }

            50% {

                transform:
                    translateY(-20px)
                    rotate(8deg);

            }

        }


        /* =========================================
           LOGIN CONTAINER
        ========================================= */

        .login-wrapper {

            width: 100%;

            max-width: 440px;

            padding: 20px;

            position: relative;

            z-index: 5;

            animation:
                pageAppear 0.8s ease;

        }


        @keyframes pageAppear {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.96);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-card {

            position: relative;

            background:
                rgba(19, 25, 21, 0.88);

            border:

                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 24px;

            padding: 42px 38px 35px;

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:

                0 30px 80px
                rgba(0, 0, 0, 0.55),

                0 0 50px
                rgba(50, 199, 106, 0.08);

            overflow: hidden;

        }


        /* Green top line */

        .login-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #32c76a,
                    #72f59a,
                    #32c76a,
                    transparent
                );

            animation:
                scanLine 3s linear infinite;

        }


        @keyframes scanLine {

            0% {

                transform:
                    translateX(-100%);

            }

            100% {

                transform:
                    translateX(100%);

            }

        }


        /* =========================================
           LOGO
        ========================================= */

        .brand {

            text-align: center;

            margin-bottom: 28px;

        }


        .logo-container {

            width: 92px;
            height: 92px;

            margin: 0 auto 18px;

            border-radius: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(50, 199, 106, 0.08);

            border:
                1px solid
                rgba(50, 199, 106, 0.25);

            box-shadow:
                0 0 35px
                rgba(50, 199, 106, 0.12);

            animation:
                logoPulse 3s ease-in-out infinite;

        }


        .logo-container img {

            width: 72px;

            height: auto;

            object-fit: contain;

        }


        @keyframes logoPulse {

            0%,
            100% {

                box-shadow:
                    0 0 25px
                    rgba(50, 199, 106, 0.08);

            }

            50% {

                box-shadow:
                    0 0 40px
                    rgba(50, 199, 106, 0.25);

            }

        }


        .brand h1 {

            font-size: 30px;

            font-weight: 800;

            letter-spacing: -0.5px;

        }


        .brand h1 span {

            color: #32c76a;

        }


        .brand p {

            margin-top: 7px;

            color: #8f9993;

            font-size: 13px;

        }


        /* =========================================
           ADMIN BADGE
        ========================================= */

        .admin-badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-top: 17px;

            padding: 7px 13px;

            border-radius: 50px;

            background:
                rgba(50, 199, 106, 0.09);

            border:
                1px solid
                rgba(50, 199, 106, 0.18);

            color: #65df8c;

            font-size: 12px;

            font-weight: 700;

        }


        .admin-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #32c76a;

            box-shadow:
                0 0 10px
                #32c76a;

            animation:
                dotPulse 1.8s infinite;

        }


        @keyframes dotPulse {

            0%,
            100% {

                opacity: 1;

            }

            50% {

                opacity: 0.35;

            }

        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {

            margin-bottom: 20px;

        }


        .form-label {

            display: block;

            margin-bottom: 9px;

            color: #cbd2ce;

            font-size: 13px;

            font-weight: 600;

        }


        .input-wrapper {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 17px;

            opacity: 0.65;

            pointer-events: none;

        }


        .form-input {

            width: 100%;

            height: 52px;

            padding:
                0 15px 0 46px;

            border-radius: 11px;

            border:
                1px solid
                rgba(255, 255, 255, 0.09);

            outline: none;

            background:
                rgba(255, 255, 255, 0.045);

            color: white;

            font-size: 14px;

            transition:
                border 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;

        }


        .form-input::placeholder {

            color: #69736d;

        }


        .form-input:focus {

            border-color:
                rgba(50, 199, 106, 0.7);

            background:
                rgba(50, 199, 106, 0.035);

            box-shadow:
                0 0 0 4px
                rgba(50, 199, 106, 0.08);

        }


        /* =========================================
           PASSWORD TOGGLE
        ========================================= */

        .password-toggle {

            position: absolute;

            right: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #7f8983;

            cursor: pointer;

            font-size: 16px;

            padding: 5px;

            transition:
                color 0.2s ease;

        }


        .password-toggle:hover {

            color: #32c76a;

        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-button {

            width: 100%;

            height: 53px;

            margin-top: 7px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #32c76a,
                    #20ae57
                );

            color: white;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 0.2px;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 10px 25px
                rgba(50, 199, 106, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 15px 35px
                rgba(50, 199, 106, 0.30);

        }


        .login-button:active {

            transform:
                translateY(0);

        }


        .login-button::before {

            content: "";

            position: absolute;

            top: 0;

            left: -100%;

            width: 70%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.22),
                    transparent
                );

            transform:
                skewX(-20deg);

        }


        .login-button:hover::before {

            animation:
                buttonShine 0.8s ease;

        }


        @keyframes buttonShine {

            from {

                left: -100%;

            }

            to {

                left: 150%;

            }

        }


        /* =========================================
           LOADING
        ========================================= */

        .loading-spinner {

            width: 18px;
            height: 18px;

            border:
                2px solid
                rgba(255,255,255,0.3);

            border-top-color: white;

            border-radius: 50%;

            display: inline-block;

            animation:
                spin 0.7s linear infinite;

            vertical-align: middle;

            margin-right: 8px;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =========================================
           ERROR MESSAGE
        ========================================= */

        .error-message {

            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 9px;

            background:
                rgba(231, 76, 60, 0.08);

            border:
                1px solid
                rgba(231, 76, 60, 0.22);

            color: #ff8d82;

            font-size: 13px;

            text-align: center;

            animation:
                shake 0.35s ease;

        }


        .error-message.show {

            display: block;

        }


        @keyframes shake {

            0%,
            100% {

                transform:
                    translateX(0);

            }

            25% {

                transform:
                    translateX(-7px);

            }

            75% {

                transform:
                    translateX(7px);

            }

        }


        /* =========================================
           FOOTER
        ========================================= */

        .login-footer {

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid
                rgba(255,255,255,0.06);

            text-align: center;

            color: #69736d;

            font-size: 11px;

        }


        .login-footer span {

            color: #32c76a;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 500px) {

            .login-card {

                padding:
                    35px 24px 28px;

                border-radius: 20px;

            }


            .brand h1 {

                font-size: 27px;

            }


            .logo-container {

                width: 82px;
                height: 82px;

            }


            .logo-container img {

                width: 64px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================
     BACKGROUND
========================================= -->

<div class="background">

    <div class="blob blob-one"></div>

    <div class="blob blob-two"></div>

    <div class="blob blob-three"></div>


    <div class="food-icon food-1">
        🍕
    </div>

    <div class="food-icon food-2">
        🍔
    </div>

    <div class="food-icon food-3">
        🍟
    </div>

    <div class="food-icon food-4">
        🥤
    </div>

</div>



<!-- =========================================
     LOGIN
========================================= -->

<div class="login-wrapper">


    <div class="login-card">


        <!-- BRAND -->

        <div class="brand">


            <div class="logo-container">

                <img
                    src="/assets/foodflow-logo.png"
                    alt="FoodFlow Logo">

            </div>


            <h1>
                Food<span>Flow</span>
            </h1>


            <p>
                Food Delivery Management System
            </p>


            <div class="admin-badge">

                <span class="admin-dot"></span>

                Administrator Access

            </div>


        </div>



        <!-- ERROR -->

        <div
            id="errorMessage"
            class="error-message">

        </div>



        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="username">

                    Username

                </label>


                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="Enter admin username"
                        autocomplete="username"
                        required>

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="password">

                    Password

                </label>


                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>


                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password">

                        👁

                    </button>

                </div>

            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
                id="loginButton">

                <span id="buttonText">
                    🔐 Sign In to FoodFlow
                </span>

            </button>


        </form>



        <!-- FOOTER -->

        <div class="login-footer">

            <p>

                Secure Admin Portal
                <span>•</span>
                FoodFlow

            </p>

            <p style="margin-top:12px">
                Ordering food?
                <a href="/customer_login.html" style="color:#32c76a;font-weight:600">Customer login</a>
            </p>

        </div>


    </div>


</div>



<script>


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById("loginForm");


const username =
    document.getElementById("username");


const password =
    document.getElementById("password");


const passwordToggle =
    document.getElementById("passwordToggle");


const loginButton =
    document.getElementById("loginButton");


const buttonText =
    document.getElementById("buttonText");


const errorMessage =
    document.getElementById("errorMessage");



/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

passwordToggle.addEventListener(
    "click",
    function () {

        if (password.type === "password") {

            password.type = "text";

            passwordToggle.textContent = "🙈";

            passwordToggle.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            password.type = "password";

            passwordToggle.textContent = "👁";

            passwordToggle.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);



/* =========================================
   HIDE ERROR
========================================= */

function hideError() {

    errorMessage.classList.remove(
        "show"
    );

    errorMessage.textContent = "";

}



/* =========================================
   SHOW ERROR
========================================= */

function showError(message) {

    errorMessage.textContent =
        "⚠️ " + message;

    errorMessage.classList.add(
        "show"
    );

}



/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        hideError();


        const user =
            username.value.trim();


        const pass =
            password.value;


        if (!user || !pass) {

            showError(
                "Please enter username and password."
            );

            return;

        }


        /* -------------------------------------
           LOADING STATE
        ------------------------------------- */

        loginButton.disabled = true;


        buttonText.innerHTML = `

            <span class="loading-spinner"></span>

            Authenticating...

        `;


        try {


            /* ---------------------------------
               SEND LOGIN REQUEST
            --------------------------------- */

            const response =
                await fetch(
                    "/api/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/x-www-form-urlencoded"

                        },

                        body:
                            `username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server error"
                );

            }


            const result =
                await response.json();



            /* ---------------------------------
               LOGIN SUCCESS
            --------------------------------- */

            if (result.success) {


                buttonText.innerHTML =
                    "✓ Login Successful";


                loginButton.style.background =
                    "linear-gradient(135deg, #32c76a, #168c43)";


                sessionStorage.setItem(
                    "foodflow-admin",
                    "true"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "/index.html";

                    },
                    500
                );


            }


            /* ---------------------------------
               LOGIN FAILED
            --------------------------------- */

            else {

                showError(
                    result.message ||
                    "Invalid username or password."
                );


                loginButton.disabled =
                    false;


                buttonText.innerHTML =
                    "🔐 Sign In to FoodFlow";


                password.value = "";

                password.focus();

            }


        } catch (error) {


            console.error(
                "Login error:",
                error
            );


            showError(
                "Unable to connect to the server."
            );


            loginButton.disabled =
                false;


            buttonText.innerHTML =
                "🔐 Sign In to FoodFlow";

        }

    }
);



/* =========================================
   INPUT EFFECTS
========================================= */

username.addEventListener(
    "input",
    hideError
);


password.addEventListener(
    "input",
    hideError
);



/* =========================================
   ENTER KEY SUPPORT
========================================= */

password.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            loginForm.requestSubmit();

        }

    }
);


</script>


</body>

</html>
