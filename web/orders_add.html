<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodFlow - Add Order</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

    <img src="/assets/foodflow-logo.png"
         alt="FoodFlow Logo"
         class="foodflow-logo">

</div>

 <button id="sidebarToggle"
                class="sidebar-toggle">

            ☰

        </button>

        <nav>

            <a href="/index.html" class="nav-item">
                🏠 Dashboard
            </a>

            <a href="/orders.html" class="nav-item">
                📦 Orders
            </a>

            <a href="/orders_add.html"
               class="nav-item active">
                ➕ Add Order
            </a>

            <a href="/orders_delete.html"
               class="nav-item">
                ❌ Cancel Order
            </a>
             <a href="/dsa.html" class="nav-item">
    🌳 DSA Operations
</a>
            <a href="/traverse.html"
               class="nav-item">
                🔄 Traverse Orders
            </a>

            <a href="/process_orders.html"
               class="nav-item">
                🚚 Process Orders
            </a>

            <a href="/cancelled_orders.html"
               class="nav-item">

   <a href="/search_sort.html" class="nav-item">
    🔎 Search & Sort
</a>

<a href="/algorithms.html" class="nav-item">
    🧮 Algorithm
</a>

        </nav>


       

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Add New Order</h1>
                <p>Create a new food delivery order</p>
            </div>

        </header>


        <section class="form-card">

            <form id="orderForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Order ID</label>

                        <input
                                type="text"
                                name="orderId"
                                placeholder="FD104"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label>Customer Name</label>

                        <input
                                type="text"
                                name="customerName"
                                placeholder="Customer name"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label>Phone</label>

                        <input
                                type="text"
                                name="phone"
                                placeholder="9876543210"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label>Restaurant</label>

                        <input
                                type="text"
                                name="restaurant"
                                placeholder="Restaurant name"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label>Food Item</label>

                        <input
                                type="text"
                                name="foodItem"
                                placeholder="Food item"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label>Quantity</label>

                        <input
                                type="number"
                                name="quantity"
                                min="1"
                                value="1"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label>Food Price</label>

                        <input
                                type="number"
                                name="foodPrice"
                                min="0"
                                step="0.01"
                                placeholder="250"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label>Distance (km)</label>

                        <input
                                type="number"
                                name="distance"
                                min="0"
                                step="0.1"
                                placeholder="5"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label>Base Delivery Charge</label>

                        <input
                                type="number"
                                name="baseCharge"
                                min="0"
                                step="0.01"
                                value="30"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label>Payment Method</label>

                        <select name="paymentMethod">

                            <option value="UPI">
                                UPI
                            </option>

                            <option value="Card">
                                Card
                            </option>

                            <option value="Cash">
                                Cash
                            </option>

                        </select>

                    </div>


                    <div class="form-group full-width">

                        <label>Delivery Address</label>

                        <input
                                type="text"
                                name="address"
                                placeholder="Delivery address"
                                required
                        >

                    </div>

                </div>


                <div class="form-actions">

                    <button
                            type="submit"
                            class="green-button">
                        Add Order
                    </button>

                    <a
                            href="/orders.html"
                            class="secondary-button">
                        Cancel
                    </a>

                </div>

            </form>


            <div id="message"
                 class="message">
            </div>

        </section>

    </main>

</div>


<script>

document.getElementById("orderForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const formData =
            new FormData(this);


        const body =
            new URLSearchParams(formData);


        const response =
            await fetch(
                "/api/add",
                {
                    method: "POST",
                    body: body
                }
            );


        const result =
            await response.json();


        const message =
            document.getElementById("message");


        if (result.success) {

            message.className =
                "message success-message";

            message.innerHTML =
                `
                ${result.message}
                <br>
                Delivery Charge:
                ₹${result.deliveryCharge.toFixed(2)}
                <br>
                Total:
                ₹${result.total.toFixed(2)}
                `;

            this.reset();

        } else {

            message.className =
                "message error-message";

            message.textContent =
                result.message;
        }

    });

</script>

</body>

</html>
