    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Traverse Orders</h1>
                <p>View orders by traversing the linked list</p>
            </div>

        </header>


        <section class="content-card">

            <div class="card-header">

                <div>
                    <h2>Order Traversal</h2>

                    <p>
                        Orders are displayed from the head
                        node to the last node.
                    </p>

                </div>

                <button
                        onclick="loadOrders()"
                        class="green-button">

                    🔄 Traverse

                </button>

            </div>


            <div id="orderCards"
                 class="order-cards">
            </div>

        </section>

    </main>

</div>


<script>

async function loadOrders() {

    const response =
        await fetch("/api/traverse");

    const orders =
        await response.json();


    const container =
        document.getElementById("orderCards");


    container.innerHTML = "";


    orders.forEach((order, index) => {

        container.innerHTML += `

            <div class="order-node">

                <div class="node-number">
                    ${index + 1}
                </div>

                <div class="node-content">

                    <h3>${order.orderId}</h3>

                    <p>
                        ${order.customerName}
                        -
                        ${order.foodItem}
                    </p>

                    <span class="status ${order.status.toLowerCase()}">
                        ${order.status}
                    </span>

                </div>

            </div>

        `;
    });
}


loadOrders();

</script>

</body>
